<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>오늘 회고 열기</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#1c1c1c; color:#e5e7eb; min-height:100vh;
         display:flex; align-items:center; justify-content:center;
         font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif; }
  .box { width:100%; max-width:420px; padding:28px 22px; text-align:center; }
  h1 { font-size:19px; margin:0 0 6px; }
  .date { color:#9ca3af; font-size:14px; margin-bottom:26px; }
  a.go { display:block; background:#3b82f6; color:#fff; text-decoration:none;
         padding:18px; border-radius:10px; font-size:18px; font-weight:700; }
  .hint { color:#9ca3af; font-size:13px; margin-top:24px; line-height:1.7; }
  code { display:block; background:#111; color:#93c5fd; padding:10px;
         border-radius:6px; margin-top:8px; font-size:11px;
         word-break:break-all; user-select:all; -webkit-user-select:all; }
</style>
</head>
<body>
<div class="box">
  <h1>🌙 오늘 회고</h1>
  <div class="date" id="date"></div>
  <a class="go" id="go" href="#">📝 옵시디언에서 열기</a>

  <div class="hint">
    <b>“파일이 없습니다”</b>가 뜨면 폰에서 <b>Syncthing이 꺼진 것</b>입니다.
    Syncthing을 켜고 동기화가 끝난 뒤 다시 누르세요.
    <code id="uri"></code>
  </div>
</div>
<script>
  function pad(n){ return (n < 10 ? "0" : "") + n; }

  var q = new URLSearchParams(location.search).get("d");
  var d;
  if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) {
    d = q;
  } else {
    var t = new Date();
    d = t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate());
  }

  var file = "Daily/" + d.slice(0, 7) + "/" + d;

  // 슬래시는 살려 둔 인코딩. %2F 를 못 푸는 구현이 있어 경로 구분자는 그대로 둔다.
  function enc(s) { return encodeURIComponent(s).replace(/%2F/g, "/"); }

  // vault 파라미터는 일부러 뺀다. 없으면 '마지막에 연 볼트'가 쓰이므로
  // 기기마다 볼트 이름이 달라도 깨지지 않는다. (2026-08-12 폰에서 확인)
  var uri = "obsidian://open?file=" + enc(file);

  document.getElementById("date").textContent = d;
  document.getElementById("go").href = uri;
  document.getElementById("uri").textContent = uri;

  // 자동 이동 시도. 브라우저가 사용자 제스처를 요구하면 무시되고,
  // 그때는 위 버튼을 누르면 된다(탭 한 번 추가).
  setTimeout(function () { location.href = uri; }, 400);
</script>
</body>
</html>
